# Nginx configuration for Laravel Application
# Serves Laravel from /var/www/html/public
# Requirements: 13.1

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    root /var/www/html/public;
    index index.php index.html index.htm;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logging
    access_log /var/log/app/nginx-access.log;
    error_log /var/log/app/nginx-error.log;

    # Max upload size (100MB for audio files)
    client_max_body_size 100M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Serve audio files from storage (must be before location /)
    location ^~ /storage/public_radio_hls/ {
        alias /var/www/html/storage/app/public_radio_hls/;
        add_header Accept-Ranges bytes;
        add_header Cache-Control "public, max-age=86400";
    }

    location ^~ /storage/public_radio_waveforms/ {
        alias /var/www/html/storage/app/public_radio_waveforms/;
        add_header Cache-Control "public, max-age=86400";
    }

    location ^~ /storage/ {
        alias /var/www/html/storage/app/;
        add_header Accept-Ranges bytes;
        add_header Cache-Control "no-cache";
    }

    location ^~ /internal-files/storage/ {
        internal;
        alias /var/www/html/storage/app/;
        add_header Accept-Ranges bytes;
        add_header Cache-Control "public, max-age=86400";
    }

    location ^~ /internal-files/lab_artifacts/ {
        internal;
        alias /var/www/html/lab_artifacts/;
        add_header Accept-Ranges bytes;
        add_header Cache-Control "public, max-age=86400";
    }

    location /ws/radio-listeners {
        proxy_pass http://node:8080/ws/radio-listeners;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    location /ws/radio-private {
        proxy_pass http://node:8080/ws/radio-private;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    location /ws/friends {
        proxy_pass http://node:8080/ws/friends;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    # Laravel routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM configuration
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        include fastcgi_params;
        
        # Timeouts for long-running requests
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to sensitive files
    location ~* \.(env|log|git|gitignore|htaccess)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Static files caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Audio files - no caching, allow range requests for streaming
    location ~* \.(mp3|wav|ogg|flac|m4a)$ {
        add_header Accept-Ranges bytes;
        add_header Cache-Control "no-cache";
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
