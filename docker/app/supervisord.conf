[supervisord]
nodaemon=true
user=root
logfile=/var/log/app/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

[program:php-fpm]
command=/usr/local/sbin/php-fpm -F
autostart=true
autorestart=true
priority=5
stdout_logfile=/var/log/app/php-fpm.stdout.log
stdout_logfile_maxbytes=0
stderr_logfile=/var/log/app/php-fpm.stderr.log
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/app/nginx.stdout.log
stdout_logfile_maxbytes=0
stderr_logfile=/var/log/app/nginx.stderr.log
stderr_logfile_maxbytes=0

[program:laravel-worker-youtube]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan queue:work --queue=youtube --sleep=3 --tries=3 --max-time=3600
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=8
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/worker-youtube.log
stopwaitsecs=3600

[program:laravel-worker-analysis]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan queue:work --queue=analysis,default --sleep=3 --tries=3 --max-time=3600
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/worker-analysis.log
stopwaitsecs=3600

[program:laravel-worker-radio-prewarm]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan queue:work --queue=radio-prewarm --sleep=3 --tries=2 --max-time=3600
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/worker-radio-prewarm.log
stopwaitsecs=3600

[program:laravel-worker-radio-hls-prewarm]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan queue:work --queue=radio-hls-prewarm --sleep=3 --tries=2 --max-time=3600
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/worker-radio-hls-prewarm.log
stopwaitsecs=3600

[program:laravel-scheduler]
command=/bin/sh -c "while true; do php /var/www/html/artisan schedule:run --verbose --no-interaction; sleep 60; done"
user=www-data
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/scheduler.log
