name: lyrics_sync_from_track_tandem_wiener
description: >
  Tandem preset that replaces the audible broadband ducking
  (vocal_mid_suppression / vocal_side_suppression / center_hard) with a
  per-bin soft Wiener vocal-mask post-filter applied after the regular
  final_polish. The mask attenuates only the time-frequency cells that
  the matching vocals stem proves are vocal-energy, leaving the kick,
  bass, hi-hats and any non-speech-band synth content fully intact.
  Use this as the default when the HARD center preset gave you "the
  whole minus dips on vocal moments" by ear -- this preset cannot do
  that by construction, because the filter is per-bin and never modulates
  the global volume envelope.

settings:
  dry_run: false
  sample_rate: 44100
  output_format: wav
  save_intermediate: true

targets:
  - vocals
  - drums
  - bass
  - guitar
  - piano
  - other
  - instrumental_mix
  - lyrics_json
  - lyrics_txt
  - lyrics_lrc
  - lyrics_srt

phases:
  - id: dual_extract
    label: Dual-backbone extraction
    steps:
      - stem: bs_backbone
        service: bsroformer-worker
        task: coarse_6stem
        model: roformer-model-bs-roformer-sw-by-jarredou
        artifact_keys:
          vocals: bs_vocals
          drums: bs_drums
          bass: bs_bass
          guitar: bs_guitar
          piano: bs_piano
          other: bs_other
          instrumental_mix: bs_instrumental_mix

      - stem: demucs_backbone_4stem
        service: demucs-worker
        task: coarse_4stem_ft
        model: htdemucs_ft
        artifact_keys:
          vocals: demucs_vocals
          drums: demucs_drums
          bass: demucs_bass
          other: demucs_other
          instrumental_mix: demucs_instrumental_mix

      - stem: demucs_backbone_extras
        service: demucs-worker
        task: coarse_6stem
        model: htdemucs_6s
        artifact_keys:
          guitar: demucs_guitar
          piano: demucs_piano

  - id: tandem_cleanup
    label: Residual-other tandem cleanup (no broadband ducking)
    steps:
      - stem: vocals
        service: bsroformer-worker
        task: vocals_resurrection
        model: roformer-model-bs-roformer-vocals-resurrection-by-unwa
        input_bus: bs_vocals

      - stem: drums
        service: restoration-worker
        task: presence_lift
        recipe: drums_unmuffle
        input_bus: demucs_drums

      - stem: bass
        service: restoration-worker
        task: presence_lift
        recipe: bass_unmuffle
        input_bus: demucs_bass

      - stem: guitar
        service: restoration-worker
        task: presence_lift
        recipe: harmonic_unmuffle
        input_bus: demucs_guitar

      - stem: piano
        service: restoration-worker
        task: presence_lift
        recipe: harmonic_unmuffle
        input_bus: demucs_piano

      - stem: other
        service: restoration-worker
        task: other_residual_rebuild
        input_bus: demucs_instrumental_mix
        # We keep the residual rebuild path because it gives a cleaner
        # "other" anchor for the hybrid below; what we drop is the
        # subsequent center-hard *suppression*.
        mode: residual
        rebuild_profile: wide_open
        build_from:
          include: [demucs_drums, demucs_bass, demucs_guitar, demucs_piano, demucs_other, vocals, bs_vocals]

      - stem: bs_instrumental_seed
        service: bsroformer-worker
        task: instrumental_resurrection
        model: roformer-model-bs-roformer-instrumental-resurrection-by-unwa
        input_bus: bs_instrumental_mix
        artifact_keys:
          instrumental_mix: bs_resurrected_instrumental_mix

      - stem: instrumental_mix
        service: restoration-worker
        task: tandem_instrumental_hybrid
        input_bus: demucs_instrumental_mix
        # No center_suppression_profile / no aggressive suppression
        # weights -- the per-bin Wiener mask in final_polish replaces
        # them. Safety-net (S2) is still active by default at 3.0 dB.
        other_detail_profile: residual_push
        build_from:
          include: [bs_instrumental_mix, bs_resurrected_instrumental_mix, vocals, bs_vocals, other]

  - id: final_polish
    label: Final opening pass + per-bin Wiener vocal-mask cleanup
    steps:
      - stem: vocals
        service: restoration-worker
        task: presence_lift
        recipe: vocals_open
        input_bus: vocals

      - stem: instrumental_mix
        service: restoration-worker
        task: presence_lift
        recipe: instrumental_polish_preserve_bs
        input_bus: instrumental_mix

      # Per-bin Wiener vocal-mask cleanup. Reads the polished instrumental
      # (the previous step just rewrote ``instrumental_mix``) and the
      # polished vocals, then overwrites ``instrumental_mix`` with a
      # cleaned version. Anti-ducking by construction: each STFT bin is
      # attenuated independently based on |instr|^2 / (|instr|^2 +
      # lambda*|vocals|^2), so a vocal "ah" at 800 Hz only cuts 800 Hz;
      # kick at 60 Hz and hat at 8 kHz pass through unmodified.
      - stem: instrumental_mix
        service: restoration-worker
        task: vocal_mask_cleanup
        input_bus: instrumental_mix
        vocal_mask_profile: balanced
        build_from:
          include: [vocals]

  - id: lyrics_transcription
    label: Word-level lyrics transcription from tandem vocals
    steps:
      - stem: lyrics_wordlevel
        service: lyrics-worker
        task: transcribe_wordlevel
        model: whisperx-large-v3
        input_bus: vocals

  - id: lyrics_alignment
    label: Exact-text alignment (optional)
    steps:
      - stem: lyrics_aligned
        service: lyrics-worker
        task: align_reference_lyrics
        model: stable-ts-large-v3
        input_bus: vocals
        build_from:
          include: [lyrics_json]
        only_if_reference_lyrics: true
