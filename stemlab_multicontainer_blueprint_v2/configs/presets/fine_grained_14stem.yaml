name: fine_grained_14stem
description: >
  Coarse 6-stem backbone plus long-tail melodic/orchestral extraction.
  Built to support per-stem architecture selection and future query-based refinement.
settings:
  dry_run: false
  sample_rate: 44100
  output_format: flac
  save_intermediate: true

targets:
  - vocals
  - drums
  - bass
  - guitar
  - piano
  - strings_orchestra
  - synth_lead
  - synth_pad
  - arps_plucks
  - brass_woodwinds
  - organ_reeds
  - fx_risers_impacts
  - ambience_residual
  - instrumental_mix
  - lyrics_json
  - lyrics_lrc

phases:
  - id: coarse_split
    label: Coarse split
    steps:
      - service: bsroformer-worker
        task: coarse_6stem
        model: roformer-model-bs-roformer-sw-by-jarredou
        output_bus: coarse_6stem
        outputs: [vocals, drums, bass, guitar, piano, other]
        artifact_keys:
          vocals: bs_vocals
          guitar: bs_guitar_seed
          piano: bs_piano_seed
          other: bs_other
          instrumental_mix: bs_instrumental_mix

      - service: demucs-worker
        task: coarse_vdbo_validation
        model: htdemucs_ft
        output_bus: demucs_validation
        outputs: [vocals, drums, bass, other]
        artifact_keys:
          vocals: demucs_vocals
          drums: demucs_drums_seed
          bass: demucs_bass_seed
          other: demucs_other
          instrumental_mix: demucs_instrumental_mix

  - id: specialist_refine
    label: Stem-specific refine
    steps:
      - stem: vocals
        service: bsroformer-worker
        task: vocals_resurrection
        model: roformer-model-bs-roformer-vocals-resurrection-by-unwa
        input_bus: bs_vocals

      - stem: drums
        service: demucs-worker
        task: drums_focus
        model: htdemucs_ft
        input_bus: demucs_drums_seed

      - stem: bass
        service: demucs-worker
        task: bass_focus
        model: htdemucs_ft
        input_bus: demucs_bass_seed

      - stem: guitar
        service: bsroformer-worker
        task: guitar_refine_from_6stem
        model: roformer-model-bs-roformer-sw-by-jarredou
        input_bus: bs_guitar_seed

      - stem: piano
        service: bsroformer-worker
        task: piano_refine_from_6stem
        model: roformer-model-bs-roformer-sw-by-jarredou
        input_bus: bs_piano_seed

      - stem: harmonic_residual
        service: audio-separator-worker
        task: harmonic_bus_cleanup
        preset: instrumental_balanced
        build_from:
          include: [bs_other, demucs_other, guitar, piano]
          exclude: [vocals, drums, bass]

  - id: long_tail_split
    label: Long-tail extraction
    steps:
      - stem: strings_orchestra
        service: querysep-worker
        task: prompt_extract
        backend: banquet_byoq
        prompt: strings_orchestra
        input_bus: harmonic_residual
        build_from:
          include: [harmonic_residual, bs_other, demucs_other, guitar, piano]

      - stem: synth_lead
        service: querysep-worker
        task: prompt_extract
        backend: banquet_byoq
        prompt: synth_lead
        input_bus: harmonic_residual
        build_from:
          include: [harmonic_residual, bs_other, demucs_other, guitar, piano]

      - stem: synth_pad
        service: querysep-worker
        task: prompt_extract
        backend: banquet_byoq
        prompt: synth_pad
        input_bus: harmonic_residual
        build_from:
          include: [harmonic_residual, bs_other, demucs_other, guitar, piano]

      - stem: arps_plucks
        service: querysep-worker
        task: prompt_extract
        backend: banquet_byoq
        prompt: arps_plucks
        input_bus: harmonic_residual
        build_from:
          include: [harmonic_residual, bs_other, demucs_other, guitar, piano]

      - stem: brass_woodwinds
        service: querysep-worker
        task: prompt_extract
        backend: banquet_byoq
        prompt: brass_woodwinds
        input_bus: harmonic_residual
        build_from:
          include: [harmonic_residual, bs_other, demucs_other, guitar, piano]

      - stem: organ_reeds
        service: querysep-worker
        task: prompt_extract
        backend: banquet_byoq
        prompt: organ_reeds
        input_bus: harmonic_residual
        build_from:
          include: [harmonic_residual, bs_other, demucs_other, guitar, piano]

      - stem: fx_risers_impacts
        service: querysep-worker
        task: prompt_extract
        backend: banquet_byoq
        prompt: fx_risers_impacts
        input_bus: harmonic_residual
        build_from:
          include: [harmonic_residual, bs_other, demucs_other, guitar, piano]

      - stem: ambience_residual
        service: querysep-worker
        task: residual_export
        prompt: ambience_residual
        input_bus: harmonic_residual
        build_from:
          include: [harmonic_residual, bs_other, demucs_other, guitar, piano]

  - id: restoration
    label: Restoration and cleanup
    steps:
      - stem: vocals
        service: restoration-worker
        task: dereverb_cleanup
        recipe: vocals_clean

      - stem: strings_orchestra
        service: restoration-worker
        task: harmonic_smoothing
        recipe: strings_clean

      - stem: synth_lead
        service: restoration-worker
        task: harmonic_smoothing
        recipe: synth_clean

      - stem: synth_pad
        service: restoration-worker
        task: harmonic_smoothing
        recipe: synth_clean

      - stem: instrumental_mix
        service: bsroformer-worker
        task: instrumental_resurrection
        model: roformer-model-bs-roformer-instrumental-resurrection-by-unwa
        input_bus: bs_instrumental_mix
        artifact_keys:
          instrumental_mix: bs_resurrected_instrumental_mix

      - stem: instrumental_mix
        service: restoration-worker
        task: tandem_instrumental_hybrid
        input_bus: demucs_instrumental_mix
        build_from:
          include:
            - bs_instrumental_mix
            - bs_resurrected_instrumental_mix
            - vocals
            - bs_vocals
            - drums
            - bass
            - guitar
            - piano
            - strings_orchestra
            - synth_lead
            - synth_pad
            - arps_plucks
            - brass_woodwinds
            - organ_reeds
            - fx_risers_impacts
            - ambience_residual

  - id: lyrics
    label: Lyrics and timing
    steps:
      - stem: lyrics_wordlevel
        service: lyrics-worker
        task: transcribe_wordlevel
        model: whisperx-large-v3
        input_bus: vocals

      - stem: lyrics_aligned
        service: lyrics-worker
        task: align_reference_lyrics
        model: stable-ts-large-v3
        input_bus: vocals
        build_from:
          include: [lyrics_json]
        only_if_reference_lyrics: true
