name: lyrics_sync_from_vocals
description: >
  Real local lyrics extraction preset. Feed it an isolated vocals stem (best) or a raw track (fallback) and get word-level lyrics JSON/LRC/SRT.
settings:
  dry_run: false
  sample_rate: 44100
  output_format: json
  save_intermediate: true

targets:
  - lyrics_json
  - lyrics_txt
  - lyrics_lrc
  - lyrics_srt

phases:
  - id: lyrics_transcription
    label: Word-level lyrics transcription
    steps:
      - stem: lyrics_wordlevel
        service: lyrics-worker
        task: transcribe_wordlevel
        model: whisperx-large-v2

  - id: lyrics_alignment
    label: Exact-text alignment (optional)
    steps:
      - stem: lyrics_aligned
        service: lyrics-worker
        task: align_reference_lyrics
        model: stable-ts-large-v3
        build_from:
          include: [lyrics_json]
        only_if_reference_lyrics: true
