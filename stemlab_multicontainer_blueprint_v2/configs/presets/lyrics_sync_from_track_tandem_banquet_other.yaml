name: lyrics_sync_from_track_tandem_banquet_other
description: >
  R11 variant of the production tandem preset. Same coarse + cleanup as
  lyrics_sync_from_track_tandem.yaml, but the `other` stem is no longer
  trusted as a single ML estimate. Instead we pull strings, synth, brass,
  organ, and FX out of the harmonic residual via querysep-worker (Banquet
  BYOQ decoder, see services/querysep-worker/app/banquet_runtime.py) and
  re-combine them with the direct ML `other` via the R9 stem_ensemble
  (median_fft) so long-tail content stops being silently dumped into a
  catch-all bucket.
settings:
  dry_run: false
  sample_rate: 44100
  output_format: wav
  save_intermediate: true

targets:
  - vocals
  - drums
  - bass
  - guitar
  - piano
  - other
  - strings_orchestra
  - synth_lead
  - synth_pad
  - arps_plucks
  - brass_woodwinds
  - organ_reeds
  - fx_risers_impacts
  - instrumental_mix
  - lyrics_json
  - lyrics_txt
  - lyrics_lrc
  - lyrics_srt

phases:
  - id: dual_extract
    label: Dual-backbone extraction
    steps:
      - stem: bs_backbone
        service: bsroformer-worker
        task: coarse_6stem
        model: roformer-model-bs-roformer-sw-by-jarredou
        artifact_keys:
          vocals: bs_vocals
          drums: bs_drums
          bass: bs_bass
          guitar: bs_guitar
          piano: bs_piano
          other: bs_other
          instrumental_mix: bs_instrumental_mix

      - stem: demucs_backbone_4stem
        service: demucs-worker
        task: coarse_4stem_ft
        model: htdemucs_ft
        artifact_keys:
          vocals: demucs_vocals
          drums: demucs_drums
          bass: demucs_bass
          other: demucs_other
          instrumental_mix: demucs_instrumental_mix

      - stem: demucs_backbone_extras
        service: demucs-worker
        task: coarse_6stem
        model: htdemucs_6s
        artifact_keys:
          guitar: demucs_guitar
          piano: demucs_piano

  - id: tandem_cleanup
    label: Real tandem cleanup and opening
    steps:
      - stem: vocals
        service: bsroformer-worker
        task: vocals_resurrection
        model: roformer-model-bs-roformer-vocals-resurrection-by-unwa
        input_bus: bs_vocals

      - stem: drums
        service: restoration-worker
        task: presence_lift
        recipe: drums_unmuffle
        input_bus: demucs_drums

      - stem: bass
        service: restoration-worker
        task: presence_lift
        recipe: bass_unmuffle
        input_bus: demucs_bass

      - stem: guitar
        service: restoration-worker
        task: presence_lift
        recipe: harmonic_unmuffle
        input_bus: demucs_guitar

      - stem: piano
        service: restoration-worker
        task: presence_lift
        recipe: harmonic_unmuffle
        input_bus: demucs_piano

      - stem: other_direct
        service: restoration-worker
        task: other_residual_rebuild
        input_bus: demucs_instrumental_mix
        # R7: direct ML other as the seed - we do NOT re-derive it from
        # subtraction here, that just accumulates errors per F3.
        mode: direct
        rebuild_profile: balanced
        build_from:
          include: [demucs_other, bs_other, vocals, bs_vocals]

      - stem: bs_instrumental_seed
        service: bsroformer-worker
        task: instrumental_resurrection
        model: roformer-model-bs-roformer-instrumental-resurrection-by-unwa
        input_bus: bs_instrumental_mix
        artifact_keys:
          instrumental_mix: bs_resurrected_instrumental_mix

      - stem: instrumental_mix
        service: restoration-worker
        task: tandem_instrumental_hybrid
        input_bus: demucs_instrumental_mix
        build_from:
          include: [bs_instrumental_mix, bs_resurrected_instrumental_mix, vocals, bs_vocals]

  - id: long_tail_extract
    label: R11 - long-tail Banquet extraction from the harmonic residual
    steps:
      - stem: strings_orchestra
        service: querysep-worker
        task: prompt_extract
        backend: banquet_byoq
        prompt: strings_orchestra
        input_bus: other_direct
        build_from:
          include: [other_direct, bs_other, demucs_other, guitar, piano]

      - stem: synth_lead
        service: querysep-worker
        task: prompt_extract
        backend: banquet_byoq
        prompt: synth_lead
        input_bus: other_direct
        build_from:
          include: [other_direct, bs_other, demucs_other, guitar, piano]

      - stem: synth_pad
        service: querysep-worker
        task: prompt_extract
        backend: banquet_byoq
        prompt: synth_pad
        input_bus: other_direct
        build_from:
          include: [other_direct, bs_other, demucs_other, guitar, piano]

      - stem: arps_plucks
        service: querysep-worker
        task: prompt_extract
        backend: banquet_byoq
        prompt: arps_plucks
        input_bus: other_direct
        build_from:
          include: [other_direct, bs_other, demucs_other, guitar, piano]

      - stem: brass_woodwinds
        service: querysep-worker
        task: prompt_extract
        backend: banquet_byoq
        prompt: brass_woodwinds
        input_bus: other_direct
        build_from:
          include: [other_direct, bs_other, demucs_other, guitar, piano]

      - stem: organ_reeds
        service: querysep-worker
        task: prompt_extract
        backend: banquet_byoq
        prompt: organ_reeds
        input_bus: other_direct
        build_from:
          include: [other_direct, bs_other, demucs_other, guitar, piano]

      - stem: fx_risers_impacts
        service: querysep-worker
        task: prompt_extract
        backend: banquet_byoq
        prompt: fx_risers_impacts
        input_bus: other_direct
        build_from:
          include: [other_direct, bs_other, demucs_other, guitar, piano]

  - id: other_assembly
    label: R11 + R9 - assemble final `other` via per-stem ensemble
    steps:
      - stem: other
        service: restoration-worker
        task: stem_ensemble
        input_bus: demucs_instrumental_mix
        # Median-FFT ensemble across the direct ML `other` and the Banquet
        # long-tail estimates that landed back in this bucket. Drops outliers
        # without overweighting any single source. See R9 in the roadmap.
        ensemble_profile: median_fft
        build_from:
          include:
            - other_direct
            - bs_other
            - demucs_other
            - strings_orchestra
            - synth_lead
            - synth_pad
            - arps_plucks
            - brass_woodwinds
            - organ_reeds
            - fx_risers_impacts

  - id: final_polish
    label: Final opening pass on tandem outputs
    steps:
      - stem: vocals
        service: restoration-worker
        task: presence_lift
        recipe: vocals_open
        input_bus: vocals

      - stem: instrumental_mix
        service: restoration-worker
        task: presence_lift
        recipe: instrumental_polish
        input_bus: instrumental_mix

  - id: lyrics_transcription
    label: Word-level lyrics transcription from tandem vocals
    steps:
      - stem: lyrics_wordlevel
        service: lyrics-worker
        task: transcribe_wordlevel
        model: whisperx-large-v3
        input_bus: vocals

  - id: lyrics_alignment
    label: Exact-text alignment (optional)
    steps:
      - stem: lyrics_aligned
        service: lyrics-worker
        task: align_reference_lyrics
        model: stable-ts-large-v3
        input_bus: vocals
        build_from:
          include: [lyrics_json]
        only_if_reference_lyrics: true
