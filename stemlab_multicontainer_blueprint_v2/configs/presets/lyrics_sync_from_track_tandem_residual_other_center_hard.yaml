name: lyrics_sync_from_track_tandem_residual_other_center_hard
description: >
  Tandem preset with rebuilt residual `other` plus aggressive center-vocal suppression inside the
  instrumental fusion stage. Use this when the default tandem keeps dragging weak back-vocal bleed
  into the minus and you prefer a drier, cleaner center even at the cost of some top-end openness.
settings:
  dry_run: false
  sample_rate: 44100
  output_format: wav
  save_intermediate: true

targets:
  - vocals
  - drums
  - bass
  - guitar
  - piano
  - other
  - instrumental_mix
  - lyrics_json
  - lyrics_txt
  - lyrics_lrc
  - lyrics_srt

phases:
  - id: dual_extract
    label: Dual-backbone extraction
    steps:
      - stem: bs_backbone
        service: bsroformer-worker
        task: coarse_6stem
        model: roformer-model-bs-roformer-sw-by-jarredou
        artifact_keys:
          vocals: bs_vocals
          drums: bs_drums
          bass: bs_bass
          guitar: bs_guitar
          piano: bs_piano
          other: bs_other
          instrumental_mix: bs_instrumental_mix

      - stem: demucs_backbone_4stem
        service: demucs-worker
        task: coarse_4stem_ft
        model: htdemucs_ft
        artifact_keys:
          vocals: demucs_vocals
          drums: demucs_drums
          bass: demucs_bass
          other: demucs_other
          instrumental_mix: demucs_instrumental_mix

      - stem: demucs_backbone_extras
        service: demucs-worker
        task: coarse_6stem
        model: htdemucs_6s
        artifact_keys:
          guitar: demucs_guitar
          piano: demucs_piano

  - id: tandem_cleanup
    label: Residual-other tandem cleanup with hard center suppression
    steps:
      - stem: vocals
        service: bsroformer-worker
        task: vocals_resurrection
        model: roformer-model-bs-roformer-vocals-resurrection-by-unwa
        input_bus: bs_vocals

      - stem: drums
        service: restoration-worker
        task: presence_lift
        recipe: drums_unmuffle
        input_bus: demucs_drums

      - stem: bass
        service: restoration-worker
        task: presence_lift
        recipe: bass_unmuffle
        input_bus: demucs_bass

      - stem: guitar
        service: restoration-worker
        task: presence_lift
        recipe: harmonic_unmuffle
        input_bus: demucs_guitar

      - stem: piano
        service: restoration-worker
        task: presence_lift
        recipe: harmonic_unmuffle
        input_bus: demucs_piano

      - stem: other
        service: restoration-worker
        task: other_residual_rebuild
        input_bus: demucs_instrumental_mix
        # R7: this preset stays on the legacy subtraction path on purpose,
        # because the center-hard variant relies on that residual signature.
        # New presets should default to mode: direct.
        mode: residual
        rebuild_profile: wide_open
        build_from:
          include: [demucs_drums, demucs_bass, demucs_guitar, demucs_piano, demucs_other, vocals, bs_vocals]

      - stem: bs_instrumental_seed
        service: bsroformer-worker
        task: instrumental_resurrection
        model: roformer-model-bs-roformer-instrumental-resurrection-by-unwa
        input_bus: bs_instrumental_mix
        artifact_keys:
          instrumental_mix: bs_resurrected_instrumental_mix

      - stem: instrumental_mix
        service: restoration-worker
        task: tandem_instrumental_hybrid
        input_bus: demucs_instrumental_mix
        other_detail_profile: residual_push
        center_suppression_profile: hard
        center_suppression_weights:
          guide_final_weight: 0.74
          guide_bs_weight: 0.26
          body_mid_suppress: 0.16
          presence_mid_suppress: 0.34
          air_mid_suppress: 0.09
          presence_side_suppress: 0.06
          guide_subtract: 0.1
          activity_floor: 0.14
        build_from:
          include: [bs_instrumental_mix, bs_resurrected_instrumental_mix, vocals, bs_vocals, other]

  - id: final_polish
    label: Final opening pass on tandem outputs
    steps:
      - stem: vocals
        service: restoration-worker
        task: presence_lift
        recipe: vocals_open
        input_bus: vocals

      - stem: instrumental_mix
        service: restoration-worker
        task: presence_lift
        recipe: instrumental_polish_preserve_bs
        input_bus: instrumental_mix

  - id: lyrics_transcription
    label: Word-level lyrics transcription from tandem vocals
    steps:
      - stem: lyrics_wordlevel
        service: lyrics-worker
        task: transcribe_wordlevel
        model: whisperx-large-v3
        input_bus: vocals

  - id: lyrics_alignment
    label: Exact-text alignment (optional)
    steps:
      - stem: lyrics_aligned
        service: lyrics-worker
        task: align_reference_lyrics
        model: stable-ts-large-v3
        input_bus: vocals
        build_from:
          include: [lyrics_json]
        only_if_reference_lyrics: true
