services:
  api:
    build:
      context: ./apps/api
    container_name: stemlab-api
    env_file:
      - .env
    environment:
      API_PORT: ${API_PORT:-8000}
      DRY_RUN: ${DRY_RUN:-true}
      DATA_ROOT: /app/data
      CONFIG_ROOT: /app/configs
      WORKER_DEMUCS_URL: ${WORKER_DEMUCS_URL:-http://demucs-worker:8000}
      WORKER_BSROFORMER_URL: ${WORKER_BSROFORMER_URL:-http://bsroformer-worker:8000}
      WORKER_AUDIO_SEPARATOR_URL: ${WORKER_AUDIO_SEPARATOR_URL:-http://audio-separator-worker:8000}
      WORKER_QUERYSEP_URL: ${WORKER_QUERYSEP_URL:-http://querysep-worker:8000}
      WORKER_RESTORATION_URL: ${WORKER_RESTORATION_URL:-http://restoration-worker:8000}
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs:ro
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      - demucs-worker
      - bsroformer-worker
      - audio-separator-worker
      - querysep-worker
      - restoration-worker

  frontend:
    build:
      context: ./apps/frontend
    container_name: stemlab-frontend
    environment:
      VITE_API_URL: http://localhost:${API_PORT:-8000}
      VITE_APP_TITLE: StemLab
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - api

  demucs-worker:
    build:
      context: ./services/demucs-worker
    container_name: stemlab-demucs-worker
    environment:
      DRY_RUN: ${DRY_RUN:-true}
      MODELS_ROOT: /app/models
      DATA_ROOT: /app/data
    volumes:
      - ./data:/app/data
      - ./models:/app/models

  bsroformer-worker:
    build:
      context: ./services/bsroformer-worker
    container_name: stemlab-bsroformer-worker
    environment:
      DRY_RUN: ${DRY_RUN:-true}
      MODELS_ROOT: /app/models
      DATA_ROOT: /app/data
    volumes:
      - ./data:/app/data
      - ./models:/app/models

  audio-separator-worker:
    build:
      context: ./services/audio-separator-worker
    container_name: stemlab-audio-separator-worker
    environment:
      DRY_RUN: ${DRY_RUN:-true}
      MODELS_ROOT: /app/models
      DATA_ROOT: /app/data
    volumes:
      - ./data:/app/data
      - ./models:/app/models

  querysep-worker:
    build:
      context: ./services/querysep-worker
    container_name: stemlab-querysep-worker
    environment:
      DRY_RUN: ${DRY_RUN:-true}
      MODELS_ROOT: /app/models
      DATA_ROOT: /app/data
    volumes:
      - ./data:/app/data
      - ./models:/app/models

  restoration-worker:
    build:
      context: ./services/restoration-worker
    container_name: stemlab-restoration-worker
    environment:
      DRY_RUN: ${DRY_RUN:-true}
      MODELS_ROOT: /app/models
      DATA_ROOT: /app/data
    volumes:
      - ./data:/app/data
      - ./models:/app/models
